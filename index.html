<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --burgundy: #6b1f2e;
      --burgundy-dark: #4a1420;
      --burgundy-light: #8f2b3f;
      --burgundy-soft: #f4e6e9;
      --cream: #faf7f5;
      --text: #2b1a1e;
      --muted: #7a6568;
      --border: #e6d9dc;
      --danger: #a8324a;
      --success: #2f6b4f;
      --radius: 14px;
      --shadow: 0 4px 18px rgba(107, 31, 46, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(143, 43, 63, 0.10), transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(107, 31, 46, 0.08), transparent 40%),
        var(--cream);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 20px 80px;
    }

    .wrap { max-width: 760px; margin: 0 auto; }

    /* ---------- Header ---------- */
    header { margin-bottom: 32px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--burgundy), var(--burgundy-light));
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      color: var(--burgundy-dark);
    }

    .student-id {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 0 60px;
    }

    .student-id span { color: var(--burgundy); font-weight: 600; }

    /* ---------- Card ---------- */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    /* ---------- Form ---------- */
    #task-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    input, textarea, select {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--burgundy-light);
      box-shadow: 0 0 0 3px rgba(143, 43, 63, 0.14);
    }

    textarea { resize: vertical; min-height: 62px; }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      transition: transform .08s, background .15s, box-shadow .15s;
    }

    button:active { transform: scale(0.98); }

    #task-submit {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--burgundy), var(--burgundy-light));
      color: #fff;
      box-shadow: 0 4px 14px rgba(107, 31, 46, 0.28);
    }

    #task-submit:hover { background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy)); }

    .btn-cancel {
      grid-column: 1 / -1;
      background: var(--burgundy-soft);
      color: var(--burgundy);
      display: none;
    }

    .btn-cancel.visible { display: block; }

    /* ---------- Status message ---------- */
    #status-message {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      font-weight: 500;
    }

    #status-message.error { display: block; background: #fbe4e9; color: var(--danger); }
    #status-message.success { display: block; background: #e3f3ea; color: var(--success); }

    /* ---------- Task list ---------- */
    #task-list { display: flex; flex-direction: column; gap: 14px; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .task-item {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 5px solid var(--burgundy-light);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: 0 2px 10px rgba(107, 31, 46, 0.06);
      transition: box-shadow .18s, transform .18s;
    }

    .task-item:hover {
      box-shadow: 0 6px 22px rgba(107, 31, 46, 0.12);
      transform: translateY(-1px);
    }

    .task-item.completed {
      border-left-color: var(--success);
      opacity: 0.82;
    }

    .task-item.completed .task-title { text-decoration: line-through; color: var(--muted); }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .task-title {
      font-weight: 650;
      font-size: 1.08rem;
      color: var(--burgundy-dark);
      margin: 0;
      line-height: 1.3;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge.done { background: #e3f3ea; color: var(--success); }
    .badge.pending { background: var(--burgundy-soft); color: var(--burgundy); }
    .badge.overdue { background: #fbe4e9; color: var(--danger); }

    .task-description {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      font-size: 0.83rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .task-meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .meta-nickname::before { content: '👤 '; }
    .meta-due::before { content: '🗓 '; }

    .task-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .task-actions button {
      font-size: 0.83rem;
      padding: 8px 14px;
      font-weight: 600;
    }

    .toggle-task {
      background: var(--burgundy);
      color: #fff;
    }

    .toggle-task:hover { background: var(--burgundy-dark); }

    .toggle-task.undo { background: var(--burgundy-soft); color: var(--burgundy); }
    .toggle-task.undo:hover { background: #ecd5da; }

    .edit-task {
      background: #fff;
      color: var(--burgundy);
      border: 1.5px solid var(--border);
    }

    .edit-task:hover { border-color: var(--burgundy-light); background: var(--burgundy-soft); }

    .delete-task {
      background: #fff;
      color: var(--danger);
      border: 1.5px solid #f0d5da;
    }

    .delete-task:hover { background: #fbe4e9; border-color: var(--danger); }

    /* ---------- Footer link ---------- */
    #contribution-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 32px;
      color: var(--burgundy);
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      padding: 12px 18px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      transition: all .15s;
    }

    #contribution-link:hover {
      background: var(--burgundy-soft);
      border-color: var(--burgundy-light);
      transform: translateY(-1px);
    }

    #contribution-link::after { content: '→'; }

    @media (max-width: 560px) {
      body { padding: 28px 14px 60px; }
      h1 { font-size: 1.55rem; }
      .student-id { margin-left: 0; }
      #task-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">T</div>
        <h1>Task Manager</h1>
      </div>
      <p class="student-id">Student ID: <span id="student-id">73500</span></p>
    </header>

    <div class="card">
      <form id="task-form">
        <div class="field full">
          <label for="task-title">Task title</label>
          <input type="text" id="task-title" placeholder="What needs to be done?" required />
        </div>

        <div class="field full">
          <label for="task-description">Description</label>
          <textarea id="task-description" placeholder="Optional details…"></textarea>
        </div>

        <div class="field">
          <label for="task-nickname">Nickname</label>
          <input type="text" id="task-nickname" placeholder="Who is doing this?" />
        </div>

        <div class="field">
          <label for="task-due">Due date &amp; time</label>
          <input type="datetime-local" id="task-due" />
        </div>

        <button type="submit" id="task-submit">Add Task</button>
        <button type="button" class="btn-cancel" id="task-cancel">Cancel edit</button>
      </form>

      <div id="status-message"></div>
      <div id="task-list"></div>
    </div>

    <a href="contribution.html" id="contribution-link">View Team Contribution Page</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
